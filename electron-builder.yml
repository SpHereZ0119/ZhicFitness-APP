appId: com.zhic.personal
productName: ZHIC 个人工作台
artifactName: ZHIC-工作台-${version}-${arch}.${ext}
directories:
  output: release
files:
  - electron/**/*
  - www/**/*
asar: true
win:
  target:
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZHIC 个人工作台
  runAfterFinish: false
